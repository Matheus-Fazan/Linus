</head>

<header>
    <div class="logo">
        <img id="logo_colegio" src="/src/main/webapp/WEB-INF/assets/imgs/logo.png" alt="Logo colegio">
        <h3>Instituto Linus</h3>
    </div>

    <nav class="nav-header">
        <ul>
            <li>
                <a href="${pageContext.request.contextPath}/area-restrita/indexPagPrincipal.jsp">Página inicial</a>

</header>

<body>
    <div class="largest-container">
        <div class="topo">
            <div id="local">
                <h1>Perfil</h1>
                <p>Visualize suas informações e as edite.</p>
            </div>
        </div>

        <center>
            <div class="main-container">
                <!-- <% Professor professor = (Professor) request.getAttribute("professor"); %> -->
                <form action="">
                    <div>
                        <label for="user">Nome:</label>
                        <input type="text" name="Nome" placeholder="Digite seu nome" value="professor.getNome();">
                        <label for="senha">Email:</label>
                        <input type="email" name="Email" placeholder="Digite seu email" value="professor.getEmail();">
                        <label for="user">Disciplina:</label>
                        <input type="text" name="disciplina" placeholder="Digite sua disciplina" value="professor.getDisciplina()">
                    </div>
                </form>
            </div>
        </center>
    </div>
</body>
