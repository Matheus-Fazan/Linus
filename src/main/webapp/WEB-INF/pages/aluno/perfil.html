<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/main/webapp/assets/style/perfil.css">
    <link rel="stylesheet" href="/src/main/webapp/assets/style/pagPrincipal.css">
    <link rel="stylesheet" href="/src/main/webapp/assets/style/crud_geral.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <title>Perfil Aluno</title>
</head>

<body>
    <header>
        <div class="logo">
            <img id="logo_colegio" src="/src/main/webapp/WEB-INF/assets/imgs/logo.png" alt="Logo colegio">
            <h3>Instituto <br> Linus</h3>
        </div>

        <nav class="nav-header">
            <ul>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexPagPrincipal.jsp">Página inicial</a>
                </li>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexObservacao.jsp">Observação</a>
                </li>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexPerfil.jsp">Perfil</a>
                </li>
                <li>
                    <a href="index.html">Logout</a>
                </li>
            </ul>
        </nav>

    </header>
    <div class="topo">
        <div id="local">
            <h1>Perfil</h1>
            <p>Visualize suas informações e as edite.</p>
        </div>
    </div>
        <center>
            <div class="main-container">
                <!-- <% Aluno aluno = (Aluno) request.getAttribute("aluno"); %> -->
                <form action="">
                    <div>
                        <label for="user">Matrícula:</label>
                        <input type="text" name="matricula" value="aluno.getMatricula()">
                        <label for="senha">Nome:</label>
                        <input type="text" name="nome" placeholder="Digite seu nome" value="aluno.getNome()">
                        <label for="user">Email:</label>
                        <input type="email" name="email" placeholder="Digite seu email" value="aluno.getEmail()">
                        <label for="cpf">CPF:</label>
                        <input type="text" name="cpf" placeholder="Digite seu cpf" value="aluno.getCpf()">
                        <label for="user">Situação:</label>
                        <input type="text" name="situacao" value="aluno.getSituacao()">
                        <label for="senha">Turma:</label>
                        <input type="text" name="turma" value="aluno.getTurma()">
                    </div>
                </form>
            </div>
        </center>
</body>

</html>
