<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/style/pagPrincipal.css">
    <link rel="stylesheet" href="../../assets/style/crud_geral.css">
    <link rel="stylesheet" href="../../assets/style/perfil.css">
    <title>Perfil ADM</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../../assets/imgs/logo.png" alt="logo colegio">
            <h3>Instituto Linus</h3>
        </div>

        <nav class="nav-header">
            <ul>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexPagPrincipal.jsp">Página inicial</a>
                </li>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexObservacao.jsp">Observação</a>
                </li>
                <li>
                    <a href="${pageContext.request.contextPath}/area-restrita/indexPerfil.jsp">Perfil</a>
                </li>
                <li>
                    <a href="index.html">Logout</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="topo">
        <h1>Crie um novo acesso</h1>
        <p>Visualize suas informações e as edite.</p>
    </div>

    <div id="procurar-card">
        <form action="${pageContext.request.contextPath}/crud/aluno" method="get">
            <input type="hidden" name="action" value="read">

            <div class="filtragem" id="filtroALuno">
                <input placeholder="Digite o número de matrícula do aluno" type="text" id="valorAluno"
                    name="valor_filtro">
            </div>
        </form>
    </div>

    <div class="acess">
        <div class="form-perfil">
            <div class="main-container">
                <h2 id="acess_title">Crie um novo aluno</h2>
                <form action="">
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" placeholder="Digite o nome do aluno">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" name="matricula" placeholder="Digite o email">
                    <label for="turma">Turma:</label>
                    <input type="text" name="turma" placeholder="Digite a turma">
                </form>
                <button type="submit">Salvar</button>
            </div>
        </div>

        <div class="form-perfil">
            <div class="main-container">
                <h2 id="acess_title">Crie um novo professor</h2>
                <form action="">
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" placeholder="Digite o nome professor">
                    <label for="usuario">Usuário:</label>
                    <input type="text" name="usuario" placeholder="Digite o nome do usuário">
                    <label for="disciplina">Disciplina:</label>
                    <input type="text" name="disciplina" placeholder="Digite a disciplina do professor">
                    <label for="senha">Senha:</label>
                    <input type="password" name="senha" placeholder="Digite a senha do professor">
                </form>
                <button type="submit">Salvar</button>
            </div>
        </div>
    </div>
</body>

</html>
